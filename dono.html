    /* Estilos específicos para dono.html (serão movidos para style.css depois) */
    .owner-panel {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .owner-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .owner-header h1 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary);
    }
    .logout-button {
      background: var(--error);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: var(--transition);
      font-weight: 500;
    }
    .logout-button:hover {
      background: darkred;
    }
    .appointments-section h2 {
      margin-bottom: 1rem;
    }
    .appointments-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .appointments-table th, .appointments-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .appointments-table th {
      background-color: #f8f9fa;
      font-weight: 600;
    }
    .appointments-table tbody tr:last-child td {
      border-bottom: none;
    }
    .status-select {
      padding: 0.3rem 0.5rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .status-concluido {
      color: var(--success);
      font-weight: bold;
    }
    .status-pendente {
      color: var(--warning);
      font-weight: bold;
    }
    .no-appointments {
      text-align: center;
      padding: 2rem;
      color: var(--text-light);
    }
  </style>
</head>
<body>
  <div class="owner-panel">
    <header class="owner-header">
      <h1><i class="fas fa-tachometer-alt"></i> Painel do Dono</h1>
      <button class="logout-button" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</button>
    </header>

    <section class="appointments-section">
      <h2><i class="far fa-calendar-check"></i> Agendamentos</h2>
      <div class="table-container">
        <table class="appointments-table" id="appointmentsTable">
          <thead>
            <tr>
              <th>Data</th>
              <th>Hora</th>
              <th>Cliente (Veículo)</th>
              <th>Serviços</th>
              <th>Total</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <!-- Linhas de agendamento serão inseridas aqui pelo JavaScript -->
            <tr>
              <td colspan="6" class="no-appointments">Nenhum agendamento encontrado.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script> <!-- Usaremos o mesmo script por enquanto, depois podemos separar -->
</body>
</html>
