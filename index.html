<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo-container">
        <i class="fas fa-car-alt logo-icon"></i>
        <h1>LavaJato Premium</h1>
      </div>
      
      <div id="error-message" class="error-message hidden">
        <i class="fas fa-exclamation-circle"></i>
        <span id="error-text">Usuário ou senha incorretos</span>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="input-group">
          <i class="fas fa-user input-icon"></i>
          <input type="text" id="username" placeholder="Usuário" autocomplete="off" required>
        </div>
        
        <div class="input-group">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="password" placeholder="Senha" autocomplete="new-password" required>
          <i class="fas fa-eye password-toggle" id="togglePassword"></i>
        </div>
        
        <button type="submit" class="btn-login">
          <i class="fas fa-sign-in-alt"></i> Entrar
        </button>
      </form>  

      <div class="login-footer">
        <p>Não tem conta? <a href="#">Cadastre-se</a></p>
        <p><a href="#">Esqueci minha senha</a></p>
      </div>
    </div>
  </div>
  <script src="script.js" defer></script>
</body>
